name: Taiko Beta Release

# Manually dispatched build-and-publish for the osu!taiko beta pre-releases.
#
# GitHub only lists workflow_dispatch workflows that exist on the default branch, so this file
# lives on master while the code being released is checked out from the `ref` input. Run it from
# the Actions tab and pick the branch you want to build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "master"
      tag:
        description: "Release tag"
        required: true
        default: "20260727-taiko-beta.12"
      title:
        description: "Release title"
        required: true
        default: "osu!jellyfish Taiko Beta 12"

permissions:
  contents: write

concurrency:
  group: taiko-beta-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Taiko beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Assemble pre-release APK
        run: ./gradlew assemblePre_release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-jellyfish-${{ github.event.inputs.tag }}
          path: build/outputs/apk/pre_release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          RELEASE_TARGET="$(git rev-parse HEAD)"

          mapfile -t apks < <(
            find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No Taiko beta APK was produced." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## osu!jellyfish Taiko Beta 12

          ### Added

          - **Custom intro theme from an .osz file.** Settings now has a "Choose theme .osz"
            option that lets you pick any .osz as the main-menu theme song instead of relying on
            the bundled theme. The file is copied into the app's own storage, so moving or
            deleting the original does not break it, and it is extracted outside the Songs
            folder so it never shows up as a playable beatmap. "Reset theme song" restores the
            bundled circles! theme.
          - **Seasonal effects toggle.** A new "Seasonal effects" switch controls seasonal
            theming. During Halloween (all of October plus November 1-2) the main-menu
            visualiser bars and the glowing corner star bursts are tinted orange.

          ### Notes

          - The corner star bursts pick up the Halloween tint on the next app launch, because
            their colour is applied when the menu scene is first built. The visualiser bars
            update immediately.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi
