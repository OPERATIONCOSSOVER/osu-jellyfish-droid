name: Taiko Beta Release

# Manually dispatched build-and-publish for the osu!taiko beta pre-releases.
#
# GitHub only lists workflow_dispatch workflows that exist on the default branch, so this file
# lives on master while the code being released is checked out from the `ref` input. Run it from
# the Actions tab and pick the branch you want to build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "master"
      tag:
        description: "Release tag"
        required: true
        default: "20260727-taiko-beta.12.1"
      title:
        description: "Release title"
        required: true
        default: "osu!jellyfish Taiko Beta 12.1"

permissions:
  contents: write

concurrency:
  group: taiko-beta-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Taiko beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Assemble pre-release APK
        run: ./gradlew assemblePre_release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-jellyfish-${{ github.event.inputs.tag }}
          path: build/outputs/apk/pre_release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          RELEASE_TARGET="$(git rev-parse HEAD)"

          mapfile -t apks < <(
            find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No Taiko beta APK was produced." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## osu!jellyfish Taiko Beta 12.1

          A follow-up to Beta 12 that makes the custom intro theme actually behave like an intro.

          ### Fixed

          - **Picked .osz files silently falling back to the bundled theme.** The importer only
            looked for audio at the very top level of the extracted .osz. Any .osz that wraps its
            contents in a folder resolved to no audio at all, which reset the setting and put the
            bundled circles! theme back. The extracted files are now searched recursively.

          ### Changed

          - **"Now playing" shows the intro.** While the intro is playing, the main menu names the
            intro's own artist and title, read from the .osu inside the .osz, instead of an
            unrelated beatmap picked out of your library.
          - **The cookie beats to the intro.** The logo pulse and the kiai star bursts now follow
            the intro's own timing points, so the beat matches what you are actually hearing.
          - **The intro is only for opening the game.** It plays on the main menu at launch and
            stops for good once you head into song select or multiplayer. Coming back to the menu
            uses the beatmap you selected in song select, matching osu!stable.
          - **Changing the theme takes effect on the next launch.** The intro's metadata and
            timing are read once while the menu is being built, so picking or resetting a theme
            now tells you to restart rather than swapping the audio out from under the menu and
            leaving the beat out of step.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi
