name: Taiko Beta Release

# Manually dispatched build-and-publish for the osu!taiko stable release.
#
# This copy lives on the release branch and is dispatched with `--ref` pointing at that branch so
# the checked-out workflow definition matches the code being released. The `ref` input below is the
# branch/tag/commit whose sources are built.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "arena/674f3044-osu-jellyfish-droid"
      tag:
        description: "Release tag"
        required: true
        default: "STABLE1152026"
      title:
        description: "Release title"
        required: true
        default: "osu!jellyfish STABLE1152026"

permissions:
  contents: write

concurrency:
  group: taiko-stable-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish osu!jellyfish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee full-build.log > /dev/null
          status=${PIPESTATUS[0]}
          {
            echo '### Gradle errors'
            grep -E "^(e: |error: |FAILURE:|What went wrong|Execution failed|> Task .*FAILED|Caused by:|Unresolved|None of the following)" full-build.log || true
          } | tee build-errors.log
          cat build-errors.log >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-jellyfish-${{ github.event.inputs.tag }}
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          RELEASE_TARGET="$(git rev-parse HEAD)"

          mapfile -t apks < <(
            find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No release APK was produced." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## osu!jellyfish STABLE1152026

          First stable-labelled release built from the osu!stable osu!taiko presentation redesign (PR #47).

          ### Highlights

          - Rebuilt the taiko playfield around stable's 768x480 reference geometry: lane `y=216`, height `200`, input drum width `180`, hit target `x=256`, scaled to the viewport.
          - Added stable skin layers: `taiko-slider` / `taiko-slider-fail`, `taiko-bar-right` / `taiko-bar-right-glow`, `taiko-bar-left`, drum inner/outer halves, `taiko-glow`, `approachcircle`, pippidon mascot, flower milestone and drawn fallbacks.
          - Added stable-timed gameplay animations: drum half flashes, hit bursts with strong `k` variants, flying hits and misses, roll ticks, denden clear, kiai glow / beat flash, animated note overlays, combo milestones and pippidon fail / clear states.
          - Extended skin loading for taiko and pippidon frame sequences, and fixed shared-texture flip and beatmap-skin frame-count handling.
          - Preserved PR #46 ScoreV1, `TaikoHitWindow`, health, strong-hit, roll-tick, denden and results behaviour.
          - In-app version is now `STABLE1152026`; the `-taiko-beta.12.9` suffix and the "Taiko BETA" app label are gone.

          ### Verification

          Built by GitHub Actions with JDK 17 and Android NDK 22.1.7171670. Unit tests and lint are not part of this release workflow.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
