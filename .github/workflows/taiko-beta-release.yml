name: Taiko Beta Release

# Manually dispatched build-and-publish for the osu!taiko beta pre-releases.
#
# GitHub only lists workflow_dispatch workflows that exist on the default branch, so this file
# lives on master while the code being released is checked out from the `ref` input. Run it from
# the Actions tab and pick the branch you want to build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "release/taiko-beta.4"
      tag:
        description: "Release tag"
        required: true
        default: "20260727-taiko-beta.11"
      title:
        description: "Release title"
        required: true
        default: "osu!jellyfish Taiko Beta 11"

permissions:
  contents: write

concurrency:
  group: taiko-beta-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Taiko beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Assemble pre-release APK
        run: ./gradlew assemblePre_release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-jellyfish-${{ github.event.inputs.tag }}
          path: build/outputs/apk/pre_release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          RELEASE_TARGET="$(git rev-parse HEAD)"

          mapfile -t apks < <(
            find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No Taiko beta APK was produced." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## osu!jellyfish Taiko Beta 11

          ### Fixed

          - The main menu no longer crashes when the osu! theme song starts playing. The
            `timingControlPoints` and `effectControlPoints` fields are now null-checked before
            calling `.isEmpty()` in `MainScene.onUpdate`, preventing a `NullPointerException`
            that occurred because these fields are not initialized until a beatmap is loaded.

          ### Carried over from Beta 10

          - The osu! theme song (circles! by nekodex) plays on the main menu.
          - Offline mode: no login, score submission, online leaderboards, or update checks.
          - Seasonal backgrounds advance when returning to the main menu or changing songs.
          - Taiko hitsounds: don uses `hitnormal`; kat uses `hitclap`; big don uses `hitnormal` +
            `hitfinish`; big kat uses `hitwhistle` + `hitfinish`.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi
