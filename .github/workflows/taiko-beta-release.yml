name: Taiko Beta Release

# Manually dispatched build-and-publish for the osu!taiko beta pre-releases.
#
# GitHub only lists workflow_dispatch workflows that exist on the default branch, so this file
# lives on master while the code being released is checked out from the `ref` input. Run it from
# the Actions tab and pick the branch you want to build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "master"
      tag:
        description: "Release tag"
        required: true
        default: "20260727-taiko-beta.12.9"
      title:
        description: "Release title"
        required: true
        default: "osu!jellyfish Taiko Beta 12.5"

permissions:
  contents: write

concurrency:
  group: taiko-beta-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Taiko beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Assemble pre-release APK
        run: ./gradlew assemblePre_release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-jellyfish-${{ github.event.inputs.tag }}
          path: build/outputs/apk/pre_release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          RELEASE_TARGET="$(git rev-parse HEAD)"

          mapfile -t apks < <(
            find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No Taiko beta APK was produced." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## osu!jellyfish 20260727 Taiko Beta 12.9

          The osu!taiko beta ruleset has been rebuilt against the osu!stable client's documented
          behaviour, and its skin elements can now come from the running skin.

          ### Fixed

          - **Hit windows were far too lenient above OD 5.** The scene recomputed them inline and
            flattened the OK and MISS windows at OD 5, so an OD 10 map kept an 80 ms OK window
            and a 95 ms miss window instead of stable's 50 ms and 70 ms. The windows now come
            from `TaikoHitWindow`, which already had the correct bend-at-5 curve.

          ### Changed

          - **Scoring is osu!stable's ScoreV1.** A hit is now worth
            `ScoreValue + min(floor(Combo / 10), 10) * floor(n * mod multiplier)`, multiplied by
            1.2 during kiai, where `ScoreValue` is 300 for a GREAT and 150 for a GOOD. The old
            `300 + combo * 12` was not stable's formula.
          - **Big notes need both colours.** A big note only pays double when both colours land
            together. A single correct key still connects for the ordinary value, and the
            opposite colour arriving within 45 ms upgrades the hit.
          - **A wrong-colour tap is a miss.** Colour is what makes the mode work: without this,
            every note could be cleared by mashing a single key.
          - **Drum rolls are tick-capped.** Stable allows four collectable ticks per beat, or
            eight on songs at 125 BPM or below, instead of following the map's slider tick rate.
          - **Dendens pay a GREAT big note on completion** rather than a flat 600.
          - **Health is scaled by the note count**, so a full combo fills the bar and a run only
            passes at 50% or better, as in stable.
          - **Combo milestones fire every 50 hits**, not every 25.
          - **Kiai time** multiplies scoring hits by 1.2 and drives a glow behind the hit
            position.

          ### Look and feel

          - The field is laid out the way stable lays it out: a thin lane high on the screen, a
            drum larger than the lane hugging the left edge, and a judgement circle just past
            the drum. The orange header and the placeholder drum panel are gone.
          - The combo counter is drawn on the drum face, the way stable does.
          - Note colours are stable's tints: don `(235, 69, 44)`, kat `(68, 141, 171)` and the
            roll head `(252, 83, 6)`.

          ### Skins

          - osu!taiko skin elements are resolved from the running skin: `taiko-bar-left`,
            `taiko-drum-inner`/`outer`, `taiko-slider`, `taiko-glow`,
            `taikohitcircle`/`taikobigcircle` and their overlays, and the `taiko-hit300`/`100`/`0`
            bursts. Every element falls back to the built-in drawn shapes when a skin provides
            nothing, so skins without osu!taiko art are unaffected.

          ### Known deviation

          Stable misses a note when both colours are struck at once on a note that is not big.
          This scene judges on the first tap to keep input latency-free, which makes that
          indistinguishable from a fast alternating stream, so the penalty is not applied.

          Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko
          multiplayer, online leaderboards, replay storage, and score uploads are disabled.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${apks[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi
