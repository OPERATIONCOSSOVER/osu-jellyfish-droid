name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

    - name: Upload Taiko beta APK
      uses: actions/upload-artifact@v7
      with:
        name: osu-jellyfish-taiko-beta-${{ github.sha }}
        path: build/outputs/apk/pre_release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish Taiko beta GitHub pre-release
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'agent/taiko-beta' ||
         startsWith(github.event.pull_request.head.ref, 'release/'))
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: 20260727-taiko-beta.12.5
        RELEASE_TITLE: osu!jellyfish 20260727 Taiko Beta 12.5
        RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -t apks < <(
          find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
        )

        if (( ${#apks[@]} == 0 )); then
          echo "No Taiko beta APK was produced." >&2
          exit 1
        fi

        cat > release-notes.md <<'EOF'
        ## osu!jellyfish 20260727 Taiko Beta 12.5

        ### osu!taiko star ratings

        - Taiko beatmaps now carry their own star rating, ported from osu!taiko's colour, rhythm
          and stamina skills, instead of borrowing the osu!standard number.
        - Song select shows taiko-appropriate statistics for taiko beatmaps: overall difficulty,
          HP and the taiko star rating, rather than approach rate and circle size, neither of
          which taiko uses.
        - Ratings are cached per beatmap and recalculated automatically when the algorithm
          version changes.

        ### Menu effects

        - New toggles in Graphics settings for the main menu snowfall effect and the menu
          parallax effect. Both were previously always on with no way to turn them off.

        ### Fixes

        - Fixed a compile regression where introducing the taiko ruleset left several game mode
          branches incomplete.
        - Restored the unit test suite, which had stopped compiling and therefore stopped running
          entirely while still reporting as a failure.

        Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko multiplayer,
        online leaderboards, replay storage, and score uploads are disabled.
        EOF

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        fi

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/
