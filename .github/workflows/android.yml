name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

    - name: Upload Taiko beta APK
      uses: actions/upload-artifact@v7
      with:
        name: osu-jellyfish-taiko-beta-${{ github.sha }}
        path: build/outputs/apk/pre_release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish Taiko beta GitHub pre-release
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'agent/taiko-beta' ||
         startsWith(github.event.pull_request.head.ref, 'release/'))
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: 20260727-taiko-beta.12.7
        RELEASE_TITLE: osu!jellyfish 20260727 Taiko Beta 12.7
        RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -t apks < <(
          find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
        )

        if (( ${#apks[@]} == 0 )); then
          echo "No Taiko beta APK was produced." >&2
          exit 1
        fi

        cat > release-notes.md <<'EOF'
        ## osu!jellyfish 20260727 Taiko Beta 12.7

        ### Two new Fun mods

        - **Wiggle.** Hit circles wiggle in place as they approach, ported from osu!lazer's
          mod of the same name: a 100 ms wiggle cycle with a 7 osu!pixel radius.
        - **Adaptive Speed.** The track speeds up when you are consistently hitting early and
          slows down when you are hitting late, following osu!lazer's mod. The rate is held
          between 0.4x and 2.5x, changes are damped so the speed drifts rather than jumps
          between notes, and a miss nudges the rate down. The starting rate is configurable
          from 0.5x to 2x.

        ### Known limitations of the new mods

        - Both mods currently affect hit circles only. Sliders and spinners are unchanged.
        - Neither mod has an icon yet, so both appear without artwork in the mod menu.
        - Adaptive Speed is unavailable in multiplayer and cannot be combined with Autoplay or
          with the rate-changing mods (Double Time, Half Time, Custom Speed, Wind Up,
          Wind Down).

        ### Note on 12.6

        Beta 12.6 was built before these two mods were merged, so it carries the taiko swell
        and drum roll work but neither mod. This build carries both.

        Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko multiplayer,
        online leaderboards, replay storage, and score uploads are disabled.
        EOF

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        fi

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/
