name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

    - name: Upload Taiko beta APK
      uses: actions/upload-artifact@v7
      with:
        name: osu-jellyfish-taiko-beta-${{ github.sha }}
        path: build/outputs/apk/pre_release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish Taiko beta GitHub pre-release
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'agent/taiko-beta' ||
         startsWith(github.event.pull_request.head.ref, 'release/'))
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: 20260727-taiko-beta.12.6
        RELEASE_TITLE: osu!jellyfish 20260727 Taiko Beta 12.6
        RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -t apks < <(
          find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
        )

        if (( ${#apks[@]} == 0 )); then
          echo "No Taiko beta APK was produced." >&2
          exit 1
        fi

        cat > release-notes.md <<'EOF'
        ## osu!jellyfish 20260727 Taiko Beta 12.6

        ### Swells now behave like osu!lazer

        - **Swells are part of the lane again.** A denden used to appear at its start time
          pinned to the middle of the screen, wearing the osu!standard spinner graphics. It
          now scrolls in from the right like every other note and stops on the hit target,
          staying under your fingers for the whole time you are alternating on it.
        - Replaced the spinner sprites with lazer's ring presentation: a target ring that
          grows to full size shortly after the swell lands, and an expanding ring that
          widens and brightens as the counter fills, so progress reads from the shape of the
          swell rather than only from the number in the middle.

        ### Drum roll fixes

        - **Rolls are no longer drawn half a length early.** The body was centred on the
          roll's start time, so half of every roll sat before the roll actually began. It is
          now anchored by its head and extends forward toward the end.
        - The body is drawn one full height longer than its duration, so its rounded caps sit
          outside the head and tail instead of being clipped.
        - Added a distinct head piece over the start of the body.
        - The body and head warm from an idle to an engaged colour as ticks are collected and
          cool back down when ticks are dropped, giving immediate feedback on whether the
          roll is actually being hit.

        ### Note on 12.5

        Beta 12.5 was built from master and therefore contained no gameplay changes over
        12.4 despite its release notes. This build is cut from the branch that carries the
        work, so the changes above are genuinely in the APK.

        Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko multiplayer,
        online leaderboards, replay storage, and score uploads are disabled.
        EOF

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        fi

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/
