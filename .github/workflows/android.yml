name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

    - name: Upload Taiko beta APK
      uses: actions/upload-artifact@v7
      with:
        name: osu-jellyfish-taiko-beta-${{ github.sha }}
        path: build/outputs/apk/pre_release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish Taiko beta GitHub pre-release
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'agent/taiko-beta' ||
         startsWith(github.event.pull_request.head.ref, 'release/'))
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: 20260727-taiko-beta.4
        RELEASE_TITLE: osu!jellyfish 20260727 Taiko Beta 4
        RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -t apks < <(
          find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
        )

        if (( ${#apks[@]} == 0 )); then
          echo "No Taiko beta APK was produced." >&2
          exit 1
        fi

        cat > release-notes.md <<'EOF'
        ## osu!jellyfish 20260727 Taiko Beta 4

        ### osu!taiko scrolling and hit feedback

        - Scroll speed is now resolved per object from the beatmap's timing and difficulty
          control points, so BPM changes and slider velocity changes are respected. Previously
          every note took a fixed 1.65s to cross the lane regardless of the map.
        - Hit windows follow the documented spec, including a real miss window. Notes now expire
          on the miss window rather than being discarded at the OK boundary.
        - Hit explosions are anchored to the judgement circle instead of following the note, and
          use normal rather than additive blending.
        - Hit notes fly away toward the health bar; missed notes keep scrolling and fade out.
        - Fixed autoplay drumroll and denden throttles that compared millisecond song positions
          against second-scale values, causing autoplay to fire every frame.
        - The health gauge now starts empty, matching taiko.

        ### Seasonal backgrounds

        - New **Background** section in Graphics settings with a seasonal backgrounds toggle.
        - Images are read from an `osu!droid/SeasonalBackgrounds/` folder, which may either hold
          images directly or contain `Winter`, `Spring`, `Summer` and `Autumn` subfolders. A
          subfolder matching the current season wins; otherwise loose images are used.
        - Optional slideshow that crossfades between the images in the folder, with a
          configurable interval (5-300 seconds, default 30).
        - `.png`, `.jpg`, `.jpeg` and `.bmp` are accepted. The toggle is off by default, and the
          game falls back to the normal background when the folder is missing or empty.
        - The folder is not created for you, and it is scanned once per session, so add images
          before launching the game.

        Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko multiplayer,
        online leaderboards, replay storage, and score uploads are disabled.
        EOF

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        fi

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/
