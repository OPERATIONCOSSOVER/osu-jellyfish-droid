name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

    - name: Upload Taiko beta APK
      uses: actions/upload-artifact@v7
      with:
        name: osu-jellyfish-taiko-beta-${{ github.sha }}
        path: build/outputs/apk/pre_release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish Taiko beta GitHub pre-release
      if: >-
        github.event.pull_request.head.ref == 'agent/taiko-beta' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: 20260727-taiko-beta.2
        RELEASE_TITLE: osu!jellyfish 20260727 Taiko Beta 2
        RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -t apks < <(
          find build/outputs/apk/pre_release -maxdepth 1 -type f -name '*.apk' -print
        )

        if (( ${#apks[@]} == 0 )); then
          echo "No Taiko beta APK was produced." >&2
          exit 1
        fi

        cat > release-notes.md <<'EOF'
        ## osu!jellyfish 20260727 Taiko Beta 2

        This experimental release adds native **osu!taiko** gameplay with a redesigned
        stable-style Taiko playfield.

        - Detects native Taiko beatmaps from `[General] Mode: 1`.
        - Adds an **osu!taiko (BETA)** ruleset selector in song select.
        - Places the Taiko lane across the upper third with the beatmap background below it.
        - Reuses the existing skinnable score, accuracy, combo, progress, and health HUD.
        - Restores the existing two-second beatmap song intro and long-intro skip control.
        - Uses invisible full-height controls: outer quarters are Kat and inner quarters are Don.
        - Supports Don, Kat, big notes, drumrolls, denden, scoring, combo, and accuracy.
        - Rescans existing song folders once after upgrading so previously ignored Taiko maps appear.

        Beta limitations: standard-mode beatmaps are not converted to Taiko, and Taiko multiplayer,
        online leaderboards, replay storage, and score uploads are disabled.
        EOF

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease
        fi

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/
